<!doctype html>
<!-- Dev only: measures every Kenney model's footprint (public/models/<kit>/*.glb)
     and renders a line-up, so cityLayout.js can scale and pick them. Open at
     /dev-models.html on the dev server; ?kit=suburban&page=0 for a line-up;
     window.__measure() returns every model's bounding box. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0e17;color:#fff;font:14px system-ui}canvas{display:block}#list{position:fixed;left:8px;top:8px;white-space:pre;font-size:11px;opacity:.8}</style></head>
<body><div id="list"></div><script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
const KITS = {
  suburban: 'building-type-a building-type-b building-type-c building-type-d building-type-e building-type-f building-type-g building-type-h building-type-i building-type-j building-type-k building-type-l building-type-m building-type-n building-type-o building-type-p building-type-q building-type-r building-type-s building-type-t building-type-u driveway-long driveway-short fence fence-1x2 fence-low path-long path-short planter tree-large tree-small'.split(' '),
  commercial: 'building-a building-b building-c building-d building-e building-f building-g building-h building-i building-j building-k building-l building-m building-n building-skyscraper-a building-skyscraper-b building-skyscraper-c building-skyscraper-d building-skyscraper-e low-detail-building-a low-detail-building-wide-a detail-awning detail-parasol-a'.split(' '),
  industrial: 'building-a building-b building-c building-d building-e building-f building-g building-h building-i building-j building-k building-l building-m building-n building-o building-p building-q building-r building-s building-t chimney-basic chimney-large chimney-medium chimney-small detail-tank detail-tank-large shipping-container-a solar-panel-flat solar-panel-landscape-group water-tower windmill windmill-low'.split(' '),
  roads: 'road-straight road-crossroad road-intersection road-bend road-curve road-end road-square road-side tile-low tile-high dumpster electricity-pole light-curved light-square traffic-light construction-barrier construction-cone road-sign-warning road-sign-stop sign-highway bridge-pillar road-roundabout'.split(' ')
}
const loader = new GLTFLoader()
const load = (kit, name) => new Promise((res, rej) => loader.load(`/models/${kit}/${name}.glb`, g => res(g.scene), undefined, rej))
window.__measureList = async (names) => {
  const out = {}
  for (const n of names) {
    try { const s = await new Promise((res, rej) => loader.load(`/models/${n}.glb`, g => res(g.scene), undefined, rej)); const sz = new THREE.Box3().setFromObject(s).getSize(new THREE.Vector3()); out[n] = [+sz.x.toFixed(2), +sz.y.toFixed(2), +sz.z.toFixed(2)] } catch { /* skip */ }
  }
  return out
}
window.__measure = async () => {
  const out = {}
  for (const [kit, names] of Object.entries(KITS)) {
    for (const name of names) {
      try {
        const s = await load(kit, name); const b = new THREE.Box3().setFromObject(s)
        const sz = b.getSize(new THREE.Vector3()); const c = b.getCenter(new THREE.Vector3())
        out[`${kit}/${name}`] = { w: +sz.x.toFixed(3), h: +sz.y.toFixed(3), d: +sz.z.toFixed(3), cx: +c.x.toFixed(3), cz: +c.z.toFixed(3), y0: +b.min.y.toFixed(3) }
      } catch (e) { out[`${kit}/${name}`] = { error: String(e.message || e) } }
    }
  }
  return out
}
// A line-up of one kit, for looking.
const q = new URLSearchParams(location.search); const kit = q.get('kit') || 'suburban'; const page = +(q.get('page') || 0)
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0e17)
scene.add(new THREE.HemisphereLight(0xd9ecff, 0x6b5636, 1.0)); const sun = new THREE.DirectionalLight(0xfff0d4, 2.2); sun.position.set(3, 6, 2); sun.castShadow = true; scene.add(sun); scene.add(new THREE.AmbientLight(0xffffff, 0.25))
const names = KITS[kit].slice(page * 12, page * 12 + 12)
const cam = new THREE.OrthographicCamera(-9, 9, 9 * innerHeight / innerWidth, -9 * innerHeight / innerWidth, 0.1, 100); cam.position.set(8, 10, 8); cam.lookAt(0, 0, 0)
const lines = []
names.forEach(async (name, i) => { try { const s = await load(kit, name); const b = new THREE.Box3().setFromObject(s); const sz = b.getSize(new THREE.Vector3()); s.position.set((i % 6) * 3 - 7.5, 0, Math.floor(i / 6) * 3 - 1.5); scene.add(s); lines.push(`${name}: ${sz.x.toFixed(2)} × ${sz.y.toFixed(2)} × ${sz.z.toFixed(2)}`); document.getElementById('list').textContent = lines.join('\n') } catch (e) { lines.push(name + ': FAILED') } })
const tick = () => { renderer.render(scene, cam); requestAnimationFrame(tick) }; tick()
</script></body></html>
