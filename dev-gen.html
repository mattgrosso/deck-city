<!doctype html>
<!-- Dev only: a contact sheet of generated buildings (src/world/buildgen.js).
     /dev-gen.html?from=1&n=24&kind=any|block|tower&kit=commercial
     Each tile is labelled with its seed, so a liked one can be kept by number. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef3e6;font:13px system-ui}canvas{display:block}#labels div{position:fixed;transform:translateX(-50%);background:#fff;border-radius:999px;padding:1px 8px;font-weight:700;color:#333;white-space:nowrap}</style></head>
<body><div id="labels"></div><script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { specFromSeed, assembleBuilding, generatorModels, texturesReady } from '/src/world/buildgen.js'
const q = new URLSearchParams(location.search)
const from = +(q.get('from') || 1); const n = +(q.get('n') || 24); const kind = q.get('kind') || 'any'; const kit = q.get('kit') || null
const cols = +(q.get('cols') || 8)
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef3e6)
scene.add(new THREE.HemisphereLight(0xeaf2ff, 0x8a7a5a, 1.35)); const sun = new THREE.DirectionalLight(0xfff6e6, 2.1); sun.position.set(4, 8, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); scene.add(sun); scene.add(new THREE.AmbientLight(0xffffff, 0.35))
const loader = new GLTFLoader(); const protos = new Map()
await Promise.all(generatorModels().map(m => new Promise(res => loader.load(`/models/${m}.glb`, g => { protos.set(m, g.scene); res() }, undefined, () => res()))))
renderer.setScissorTest(true)
const rows = Math.ceil(n / cols)
const tw = innerWidth / cols; const th = innerHeight / rows
const dir = new THREE.Vector3(Math.cos(0.58) * Math.cos(0.56), Math.sin(0.56), Math.sin(0.58) * Math.cos(0.56))
const tiles = []
const labels = document.getElementById('labels')
for (let i = 0; i < n; i++) {
  const seed = from + i
  const srcs = q.get('srcs') ? q.get('srcs').split(',') : null
  const wides = q.get('wide') ? q.get('wide').split(',') : null
  const spec = wides ? { id: 'w' + i, type: 'wide', src: wides[i % wides.length], bays: Math.floor(i / wides.length) * 2, palette: ['a', 'cream', 'slate', 'sand'][i % 4], props: [] } : srcs ? { id: 'x', type: 'block', src: srcs[Math.floor(i / 2)], floors: 0, palette: 'a', props: [] } : specFromSeed(seed, { kind, kit })
  const s = new THREE.Scene(); s.background = new THREE.Color(0xeef3e6)
  s.add(new THREE.HemisphereLight(0xeaf2ff, 0x8a7a5a, 1.35)); const sun = new THREE.DirectionalLight(0xfff6e6, 2.1); sun.position.set(4, 8, 3); s.add(sun); s.add(new THREE.AmbientLight(0xffffff, 0.35))
  const orig = srcs && i % 2 === 0
  const { group, height } = orig ? { group: protos.get(spec.src).clone(), height: 1.5 } : assembleBuilding(spec, (m) => protos.get(m)); s.add(group)
  const plate = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.04, 1.48), new THREE.MeshStandardMaterial({ color: 0x8ccf7a })); plate.position.y = -0.02; s.add(plate)
  tiles.push({ s, i, spec, height })
  const d = document.createElement('div')
  d.textContent = `#${seed} ${spec.src.split('/')[1].replace('building-', '')} ${spec.type === 'tower' ? `x${spec.stretch}` : spec.type === 'wide' ? `bays+${spec.bays}` : `+${spec.floors}`} ${spec.palette}`
  d.style.left = `${((i % cols) + 0.5) * tw}px`; d.style.top = `${(Math.floor(i / cols) + 1) * th - 22}px`; labels.appendChild(d)
}
// One scale for the whole sheet, so tall reads as tall.
const maxH = Math.max(3, ...tiles.map(t => t.height + 0.6))
const render = () => {
  for (const t of tiles) {
    const x = (t.i % cols) * tw; const y = innerHeight - (Math.floor(t.i / cols) + 1) * th
    renderer.setViewport(x, y, tw, th); renderer.setScissor(x, y, tw, th)
    const half = maxH * 0.6; const cam = new THREE.OrthographicCamera(-half * tw / th, half * tw / th, half, -half, 0.1, 200)
    cam.position.copy(new THREE.Vector3(0, maxH * 0.42, 0).add(dir.clone().multiplyScalar(40))); cam.lookAt(0, maxH * 0.42, 0)
    renderer.render(t.s, cam)
  }
}
await texturesReady()
render()
setTimeout(() => { render(); window.__specs = tiles.map(t => t.spec); window.__ready = true }, 900)
</script></body></html>
