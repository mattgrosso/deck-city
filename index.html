<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e17" />
    <meta name="description" content="Deck City - a deck-building city builder, built for a TV and a controller." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Deck City" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Deck City</title>
    <style>
      html, body { background-color: #0b0e17; }

      .launch-splash img { width: 120px; height: 120px; margin-bottom: 14px; border-radius: 26px; }

    <noscript>Deck City needs JavaScript to run.</noscript>
    <div id="app">
      <div class="launch-splash"><img src="/icon-192.png" alt=""><div>Deck City</div></div>

    <script type="module" src="/src/main.js"></script>
